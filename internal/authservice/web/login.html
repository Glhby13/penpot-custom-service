<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Sign in · UX Studio</title>
<link rel="icon" href="/auth-ui/assets/logo.png" type="image/png">
<link rel="stylesheet" href="/auth-ui/assets/login.css">
</head>
<body>
<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle day or night mode" title="Switch theme">
  <span id="theme-icon" class="theme-icon" aria-hidden="true"></span>
</button>
<main class="shell">
  <section class="card">
    <div class="brand">
      <img id="brand-logo" class="brand-logo" src="/auth-ui/assets/logo.png" alt="UX Studio" width="300" height="55">
    </div>
    <h1>Sign in</h1>
    <form id="f" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      <label for="password">Password</label>
      <div class="pw">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="toggle" type="button" class="ghost" aria-label="Show password">Show</button>
      </div>
      <div id="err" class="err" role="alert" hidden>
        <span id="err-text" class="err-text"></span>
        <button id="err-close" class="err-close" type="button" aria-label="Close message">✕</button>
      </div>
      <button id="submit" class="btn primary" type="submit">Sign in with AD BTN</button>
      <div id="local-box" hidden>
        <div class="or"><span>or</span></div>
        <button id="local-btn" class="btn secondary" type="button">Sign in with local account</button>
        <p class="hint">Emergency accounts only. Enter full e-mail address as username.</p>
      </div>
    </form>
    <p class="foot">&copy; 2026 PT Bank Tabungan Negara (Persero) Tbk<br>Tim Platform Engineering</p>
  </section>
</main>
<script src="/auth-ui/assets/login.js"></script>
</body>
</html>
