# Author / Agent: Codex
# Lab gateway vhost; MCP bearer query strings must not be logged.
map $http_upgrade $penpot_connection_upgrade {
    default upgrade;
    \x27\x27      close;
}

server {
    listen 80;
    access_log off;
    error_log /dev/null;
    server_name penpot.lab.local uxstudio.lab.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name penpot.lab.local uxstudio.lab.local;

    ssl_certificate     /etc/ssl/certs/star_lab_local_fullchain.pem;
    ssl_certificate_key /etc/ssl/private/star.lab.local.key;

    client_max_body_size 100m;
    # MCP query credentials must never enter nginx logs.
    access_log off;
    error_log /dev/null;

    location / {
        proxy_pass http://ingress-nginx-http;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $penpot_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
